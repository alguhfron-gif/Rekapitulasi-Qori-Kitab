<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer subtle ring -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.3" />
  
  <!-- Book Icon -->
  <g transform="translate(106, 116)">
    <!-- Left Page -->
    <path d="M150 240 C90 200, 20 210, 0 220 L0 50 C20 40, 90 30, 150 70 Z" fill="#ffffff" fill-opacity="0.95" />
    <!-- Right Page -->
    <path d="M150 240 C210 200, 280 210, 300 220 L300 50 C280 40, 210 30, 150 70 Z" fill="#f1f5f9" />
    <!-- Spine / Center Bookmark -->
    <path d="M144 65 L156 65 L156 250 L150 244 L144 250 Z" fill="#059669" />
    
    <!-- Lines on Left Page -->
    <line x1="30" y1="90" x2="120" y2="90" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
    <line x1="30" y1="125" x2="120" y2="125" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
    <line x1="30" y1="160" x2="100" y2="160" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
    
    <!-- Lines on Right Page -->
    <line x1="180" y1="90" x2="270" y2="90" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
    <line x1="180" y1="125" x2="270" y2="125" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
    <line x1="180" y1="160" x2="250" y2="160" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
    
    <!-- Checkmark Badge on top of Book -->
    <circle cx="230" cy="190" r="42" fill="#10b981" stroke="#ffffff" stroke-width="6" />
    <path d="M214 190 L226 202 L248 178" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
